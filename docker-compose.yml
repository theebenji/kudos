# Local infrastructure. The Compose project name is one of the three places the product name lives.
#   docker compose up -d                       → Postgres + S3 storage (run the apps with `pnpm dev`)
#   docker compose --profile app up -d --build → also migrate, then run the API and web app in containers
# Secrets below are dev-only defaults, matching .env.example. Never reuse them anywhere real.
name: kudos

x-db-url: &db-url postgres://kudos:kudos@postgres:5432/kudos
x-jwt-secret: &jwt-secret dev-only-jwt-secret-change-me-at-least-32-chars

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: kudos
      POSTGRES_PASSWORD: kudos
      POSTGRES_DB: kudos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudos -d kudos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for avatars (ADR-0011). Dev-only credentials live in infra/seaweedfs/s3.json.
  storage:
    image: chrislusf/seaweedfs:4.47
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Applies SQL migrations once, then exits. Seed from the host with `pnpm db:seed`.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: *db-url
      AUTH_JWT_SECRET: *jwt-secret
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_started

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: *db-url
      AUTH_JWT_SECRET: *jwt-secret
      AUTH_SECRET: dev-only-auth-secret-change-me-at-least-32-chars
      AUTH_URL: http://localhost:3000
      # Demo mode: the containers run production builds, so the seeded-user picker must be opted into.
      AUTH_DEV_LOGIN: "true"
      API_URL: http://api:4000/graphql
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
